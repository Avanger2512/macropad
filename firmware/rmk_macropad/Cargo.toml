[package]
name = "macropad-vial"
version = "0.2.0"
authors = ["Haobo Gu <haobogu@outlook.com>"]
description = "Keyboard firmware written in Rust"
homepage = "https://github.com/rmk-rs/rmk"
repository = "https://github.com/rmk-rs/rmk"
readme = "README.md"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "macropad-vial"
test = false
bench = false

[dependencies]
rmk = { git = "https://github.com/rmk-rs/rmk", rev = "762b4a90a1affd4a1ba4fc7d7dde13bab2eacab5", default-features = false, features = [
    "esp32s3_ble",
    "log",
    "storage",
    "vial",
    "host_lock",
    "sh1106",
] }

embassy-executor = { version = "0.10" }
embassy-time = "0.5"
embedded-hal = "1.0"
embedded-graphics = "0.8.2"
esp-alloc = { version = "0.11" }
esp-backtrace = { version = "0.20", features = [
    "esp32s3",
    "panic-handler",
    "println",
] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32s3", "log-04"] }
esp-hal = { version = "1.2.2", features = ["esp32s3", "unstable"] }
esp-println = { version = "0.18", features = ["esp32s3", "log-04"] }
esp-radio = { version = "1.0.0-beta.1", features = ["esp32s3", "unstable", "ble"] }
esp-rtos = { version = "0.4", features = ["esp32s3", "esp-radio", "embassy"] }
esp-storage = { version = "0.10", features = ["embedded-storage", "esp32s3"] }

bt-hci = { version = "0.10" }

[build-dependencies]
cc = "1.2.9"
const-gen = "1.6"
embuild = "0.33"
json = "0.12"
xz2 = "0.1.7"

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.dev.package.esp-storage]
opt-level = 3

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'thin'
opt-level = 3
overflow-checks = false
